<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car Scout UA</title>
<style>
  :root {
    --ink: #0e1012;
    --panel: #16191c;
    --panel-2: #1c2024;
    --line: #23282d;
    --text: #e9e7e2;
    --muted: #878d94;
    --amber: #f0a92c;
    --green: #55a86c;
    --red: #e0574f;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ink); color: var(--text);
    font-family: var(--sans); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px 72px; }

  /* --- шапка --- */
  header { border-bottom: 1px solid var(--line); margin-bottom: 22px; }
  .head-in { max-width: 1080px; margin: 0 auto; padding: 26px 20px 20px; }
  h1 {
    margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .14em;
    text-transform: uppercase; color: var(--text);
  }
  .sub { margin-top: 6px; color: var(--muted); font-size: 13px; }
  .sub b { color: var(--text); font-weight: 500; font-family: var(--mono); }

  .stats { display: flex; flex-wrap: wrap; gap: 26px; margin-top: 20px; }
  .stat .n {
    font-family: var(--mono); font-size: 24px; font-weight: 500;
    font-variant-numeric: tabular-nums; line-height: 1.1;
  }
  .stat .l {
    font-size: 11px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--muted); margin-top: 3px;
  }
  .stat.hit .n { color: var(--amber); }
  .stat.alarm .n { color: var(--red); }

  /* --- керування --- */
  .bar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    margin-bottom: 18px;
  }
  input[type=search] {
    flex: 1 1 200px; min-width: 160px; background: var(--panel);
    border: 1px solid var(--line); color: var(--text); border-radius: 7px;
    padding: 9px 12px; font-family: var(--sans); font-size: 14px;
  }
  input[type=search]::placeholder { color: var(--muted); }
  .toggle {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
    padding: 8px 12px; font-size: 13px; color: var(--muted); user-select: none;
  }
  .toggle:has(input:checked) { color: var(--text); border-color: #3a4149; background: var(--panel-2); }
  .toggle input { accent-color: var(--amber); margin: 0; }
  select {
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 7px; padding: 8px 10px; font-size: 13px; font-family: var(--sans);
  }
  .count { color: var(--muted); font-size: 13px; font-family: var(--mono); }

  /* --- цінові сходи --- */
  .ladder { display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: grid; grid-template-columns: 132px minmax(0, 1fr) 190px;
    gap: 18px; align-items: center;
    background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid transparent; border-radius: 9px;
    padding: 14px 16px; cursor: pointer;
    transition: background .12s ease, border-color .12s ease;
  }
  .row:hover { background: var(--panel-2); }
  .row.is-hit { border-left-color: var(--amber); }
  .row.is-alarm { border-left-color: var(--red); }
  .row:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .price {
    font-family: var(--mono); font-size: 21px; font-weight: 500;
    font-variant-numeric: tabular-nums; letter-spacing: -.01em;
  }
  .price .in-budget { color: var(--green); }
  .expected {
    font-family: var(--mono); font-size: 12px; color: var(--muted);
    font-variant-numeric: tabular-nums; margin-top: 2px;
  }

  .name { font-weight: 500; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .flag { font-size: 13px; }
  .specs {
    margin-top: 5px; color: var(--muted); font-size: 13px;
    display: flex; flex-wrap: wrap; gap: 4px 10px;
  }
  .specs span { white-space: nowrap; }
  .specs .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .src {
    font-size: 10px; letter-spacing: .07em; text-transform: uppercase;
    border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; color: var(--muted);
  }

  /* смуга «факт проти справедливої ціни» */
  .gauge { display: flex; flex-direction: column; gap: 6px; }
  .gauge-top {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums;
  }
  .deal-pos { color: var(--amber); font-weight: 500; }
  .deal-neg { color: var(--muted); }
  .track { height: 5px; background: #2a3036; border-radius: 3px; position: relative; overflow: hidden; }
  .fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--amber); }
  .fill.over { background: #454c53; }
  .fitline {
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; color: var(--muted); letter-spacing: .05em; text-transform: uppercase;
  }
  .fitbar { flex: 1; height: 3px; background: #2a3036; border-radius: 2px; overflow: hidden; }
  .fitbar i { display: block; height: 100%; background: var(--green); }
  .fitval { font-family: var(--mono); color: var(--text); font-variant-numeric: tabular-nums; }

  /* --- розгорнута картка --- */
  .detail {
    grid-column: 1 / -1; border-top: 1px solid var(--line); margin-top: 12px;
    padding-top: 12px; display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  }
  .detail dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; font-size: 13px; }
  .detail dt { color: var(--muted); }
  .detail dd {
    margin: 0; text-align: right; font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }
  .detail h4 {
    margin: 0 0 7px; font-size: 11px; letter-spacing: .09em;
    text-transform: uppercase; color: var(--muted); font-weight: 500;
  }
  .alarm-note {
    grid-column: 1 / -1; background: rgba(224,87,79,.1);
    border: 1px solid rgba(224,87,79,.45); color: #ffb0aa;
    border-radius: 7px; padding: 9px 11px; font-size: 13px;
  }
  .go {
    display: inline-block; margin-top: 4px; color: var(--ink); background: var(--amber);
    text-decoration: none; font-weight: 600; font-size: 13px;
    padding: 8px 14px; border-radius: 7px;
  }
  .go:hover { filter: brightness(1.08); }
  .empty { color: var(--muted); text-align: center; padding: 48px 0; font-size: 14px; }

  footer {
    border-top: 1px solid var(--line); margin-top: 40px;
    color: var(--muted); font-size: 12px; line-height: 1.7;
  }
  .foot-in { max-width: 1080px; margin: 0 auto; padding: 18px 20px 30px; }
  footer a { color: var(--text); }

  @media (max-width: 720px) {
    .row { grid-template-columns: 1fr; gap: 12px; }
    .gauge { order: 3; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<header><div class="head-in">
  <h1>Car Scout UA</h1>
  <div class="sub" id="meta"></div>

</div></header>

<div class="wrap">
  <div class="bar">
    <input type="search" id="q" placeholder="марка, модель, місто">

      <option value="km">за пробігом</option>
      <option value="-year">за роком</option>
    </select>
    <span class="count" id="count"></span>
  </div>
  <div class="ladder" id="ladder"></div>
</div>

<footer><div class="foot-in">

</div></footer>

function sorted(list) {
  const key = document.getElementById("sort").value;
  const desc = key.startsWith("-");
  const k = desc ? key.slice(1) : key;
  return list.slice().sort((a, b) => {
    const x = a[k], y = b[k];
    if (x === null) return 1;
    if (y === null) return -1;
    return desc ? y - x : x - y;
  });

}

  const over = c.deal < 0;
  const sign = c.deal >= 0 ? "−" : "+";
  return '<div class="gauge">' +
    '<div class="gauge-top"><span class="' + (over ? "deal-neg" : "deal-pos") + '">' +
      sign + Math.abs(c.deal * 100).toFixed(0) + "% до ринку</span>" +
      "<span class='deal-neg'>" + usd(c.expected) + "</span></div>" +
    '<div class="track"><i class="fill ' + (over ? "over" : "") + '" style="width:' + pct.toFixed(1) + '%"></i></div>' +
    '<div class="fitline">відповідність<span class="fitbar"><i style="width:' +
      ((c.fit || 0) * 100).toFixed(0) + '%"></i></span><span class="fitval">' +
      (c.fit === null ? "—" : c.fit.toFixed(2)) + "</span></div>" +
  "</div>";
}

function specs(c) {
  const bits = [];
  bits.push('<span class="num">' + c.year + "</span>");
  if (c.km !== null) bits.push('<span class="num">' + Math.round(c.km / 1000) + "k км</span>");
  if (c.engine !== null) bits.push('<span class="num">' + c.engine + " л</span>");
  if (c.gearbox) bits.push("<span>" + esc(c.gearbox) + "</span>");
  if (c.city) bits.push("<span>" + esc(c.city) + "</span>");
  bits.push('<span class="src">' + (c.source === "rst" ? "RST" : "AUTO.RIA") + "</span>");
  return bits.join("");
}

function detail(c) {
  const hist = c.history.length < 2
    ? "<div style='color:var(--muted);font-size:13px'>Ціна не змінювалась відколи стежимо.</div>"
    : "<dl>" + c.history.slice(-6).map(([d, p]) =>
        "<dt>" + new Date(d).toLocaleDateString("uk-UA") + "</dt><dd>" + usd(p) + "</dd>").join("") + "</dl>";
  const gap = c.expected === null ? "—" : usd(c.expected - c.price);
  return '<div class="detail">' +
    (c.wanted ? '<div class="alarm-note"><b>У розшуку</b> за реєстром Національної поліції — ' +
      esc(c.wantedNote || "") + "</div>" : "") +
    "<div><h4>Ціна</h4><dl>" +
      "<dt>Просять</dt><dd>" + usd(c.price) + "</dd>" +
      "<dt>Справедлива</dt><dd>" + usd(c.expected) + "</dd>" +
      "<dt>Різниця</dt><dd>" + gap + "</dd>" +
    "</dl></div>" +
    "<div><h4>Авто</h4><dl>" +
      "<dt>Рік</dt><dd>" + c.year + "</dd>" +
      "<dt>Пробіг</dt><dd>" + (c.km === null ? "—" : c.km.toLocaleString("uk-UA") + " км") + "</dd>" +
      "<dt>Двигун</dt><dd>" + (c.engine === null ? "—" : c.engine + " л") + "</dd>" +
      "<dt>Коробка</dt><dd>" + esc(c.gearbox || "—") + "</dd>" +
      "<dt>Місто</dt><dd>" + esc(c.city || "—") + "</dd>" +
    "</dl></div>" +
    "<div><h4>Історія ціни</h4>" + hist +
      '<a class="go" href="' + esc(c.url) + '" target="_blank" rel="noopener">Відкрити оголошення</a></div>' +
  "</div>";
}

function render() {
  const rows = view();
  document.getElementById("count").textContent = rows.length + " авто";
  const el = document.getElementById("ladder");
  if (rows.length === 0) {
    el.innerHTML = '<div class="empty">За цими умовами нічого немає. Послаб фільтри.</div>';
    return;
  }
  el.innerHTML = rows.map(c =>
    '<article class="row ' + (isHit(c) ? "is-hit " : "") + (c.wanted ? "is-alarm" : "") +
      '" data-id="' + c.id + '" tabindex="0">' +
      "<div><div class='price" + (inBudget(c) ? " in-budget" : "") + "'>" + usd(c.price) + "</div>" +
        '<div class="expected">' + (c.expected === null ? "" : "ринок " + usd(c.expected)) + "</div></div>" +
      '<div><div class="name">' +
        (isHit(c) ? '<span class="flag" title="вигідно і підходить">🎯</span>' : "") +
        (c.wanted ? '<span class="flag" title="у розшуку">🚨</span>' : "") +
        esc(c.title) + "</div>" +
        '<div class="specs">' + specs(c) + "</div></div>" +
      gauge(c) +
      (open === c.id ? detail(c) : "") +
    "</article>"
  ).join("");
}

document.getElementById("ladder").addEventListener("click", e => {
  if (e.target.closest("a")) return;
  const row = e.target.closest(".row");
  if (!row) return;
  const id = Number(row.dataset.id);
  open = open === id ? null : id;
  render();
});
document.getElementById("ladder").addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const row = e.target.closest(".row");
  if (!row) return;
  e.preventDefault();
  const id = Number(row.dataset.id);
  open = open === id ? null : id;
  render();
});
["q", "only", "budget", "sort"].forEach(id =>
  document.getElementById(id).addEventListener("input", () => { open = null; render(); }));

render();
</script>
</body>
</html>
